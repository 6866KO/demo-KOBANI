<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6866 | Hazel Edition</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:radial-gradient(ellipse at top,#93805c,#494333,#211e19);
color:#f6e6cf;
font-family:Arial,sans-serif;
text-align:center;
min-height:100vh;
}
header{padding:35px;border-bottom:1px solid #ad9672}
.logo{font:55px Georgia;letter-spacing:10px}
.subtitle{letter-spacing:5px;font-size:12px}
h1{font-family:Georgia}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px;
max-width:850px;
margin:auto;
padding:20px;
}
.card{
background:linear-gradient(145deg,#827357,#403a30);
border:1px solid #bba382;
border-radius:24px;
padding:25px 12px;
}
svg{width:110px;height:110px}
button{
background:linear-gradient(135deg,#f2ddc5,#c7a47c);
color:#403326;
border:0;
border-radius:14px;
padding:15px 25px;
font-weight:bold;
cursor:pointer;
}
button:hover{filter:brightness(1.1)}
#collection{
max-width:850px;
margin:25px auto;
padding:20px;
}
.items{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}
.item{
background:#ffffff12;
border:1px solid #a99476;
border-radius:18px;
padding:18px;
}
.item svg{width:90px;height:90px}
footer{padding:30px;font-size:12px}
</style>
</head>
<body>

<header>
<div class="logo">6866</div>
<div class="subtitle">HAZEL EDITION</div>
</header>

<h1>Discover Your Collection</h1>
<p>Luxury meets elegance</p>

<div class="grid" id="boxes"></div>

<section id="collection" hidden>
<h2 id="name"></h2>
<div class="items" id="items"></div>
</section>

<footer>
Free demo | Virtual collection | No real prizes
</footer>

<script>
const pictures = {
watch:`<svg viewBox="0 0 120 120">
<rect x="46" y="2" width="28" height="116" rx="9" fill="#c8a56b"/>
<circle cx="60" cy="60" r="35" fill="#e9cf9a"/>
<circle cx="60" cy="60" r="29" fill="#38372c"/>
<path d="M60 38V60L77 70" stroke="#f6e1b0" stroke-width="4" fill="none"/>
<circle cx="60" cy="60" r="4" fill="gold"/>
</svg>`,

ring:`<svg viewBox="0 0 120 120">
<circle cx="60" cy="76" r="29" fill="none" stroke="#dcb77b" stroke-width="12"/>
<polygon points="30,35 45,15 75,15 90,35 60,66" fill="#e3f5f5"/>
<path d="M30 35H90M45 15L60 66L75 15" stroke="#8cb9c4" fill="none"/>
</svg>`,

phone:`<svg viewBox="0 0 120 120">
<rect x="30" y="4" width="60" height="112" rx="12" fill="#c8b49c"/>
<rect x="35" y="9" width="50" height="102" rx="9" fill="#626b49"/>
<circle cx="58" cy="70" r="24" fill="#a7a078"/>
<circle cx="66" cy="45" r="18" fill="#c5b28d"/>
<rect x="48" y="13" width="24" height="7" rx="4" fill="#222"/>
</svg>`,

tv:`<svg viewBox="0 0 120 120">
<rect x="3" y="17" width="114" height="76" rx="5" fill="#222"/>
<rect x="8" y="22" width="104" height="66" rx="3" fill="#a4b29a"/>
<path d="M8 80L40 40L65 65L90 32L112 65V88H8Z" fill="#536747"/>
<path d="M60 93V105M35 107H85" stroke="#c6b28e" stroke-width="5"/>
</svg>`
};

const groups=[
{title:"Watch Box",type:"watch",items:["Golden Watch","Classic Watch","Silver Watch","Sport Watch"]},
{title:"Ring Box",type:"ring",items:["Diamond Ring","Golden Ring","Silver Ring","Rose Ring"]},
{title:"Phone Box",type:"phone",items:["Premium Phone","Smartphone","Classic Phone","Mini Phone"]},
{title:"TV Box",type:"tv",items:["62-inch Smart TV","4K TV","LED TV","Mini Monitor"]}
];

document.getElementById("boxes").innerHTML=
groups.map((g,i)=>`
<div class="card">
${pictures[g.type]}
<h2>${g.title}</h2>
<button onclick="showBox(${i})">
View Collection
</button>
</div>
`).join("");

function showBox(i){
const g=groups[i];
document.getElementById("collection").hidden=false;
document.getElementById("name").textContent=g.title;
document.getElementById("items").innerHTML=
g.items.map(item=>`
<div class="item">
${pictures[g.type]}
<h3>${item}</h3>
<p>Virtual Item</p>
</div>
`).join("");
document.getElementById("collection")
.scrollIntoView({behavior:"smooth"});
}
</script>
</body>
</html>
