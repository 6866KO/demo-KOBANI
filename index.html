<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6866 | Accessories</title>

<style>

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at top,#817052,#353c2e,#161c17);
 color:#f8e5bd;
 min-height:100vh;
}

header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:25px 5%;
 border-bottom:1px solid #a48d61;
}

.logo{
 font:45px Georgia;
 letter-spacing:8px;
}

select{
 padding:12px;
 background:#30382b;
 color:#ffe1a1;
 border:1px solid #ad9364;
 border-radius:12px;
}

.hero{
 text-align:center;
 padding:45px 20px;
}

h1{
 font:48px Georgia;
 margin:10px;
}

.hero p{
 color:#d8c8a7;
 letter-spacing:3px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:20px;
 max-width:1400px;
 margin:auto;
 padding:20px;
}

.card{
 text-align:center;
 border:1px solid #8f805d;
 background:linear-gradient(145deg,#ffffff12,#00000035);
 border-radius:22px;
 padding:20px;
 overflow:hidden;
 transition:.3s;
}

.card:hover{
 transform:translateY(-5px);
 border-color:#ffe2a2;
 box-shadow:0 10px 35px #0005;
}

.stage{
 height:200px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:radial-gradient(ellipse,#ffffff18,transparent 70%);
 perspective:700px;
}

.gift{
 width:135px;
 height:115px;
 position:relative;
 border-radius:7px;
 background:linear-gradient(135deg,var(--c),#171b16);
 box-shadow:18px 20px 25px #0008;
 transform:rotate(-5deg) rotateY(-20deg);
}

.lid{
 position:absolute;
 top:-12px;
 left:-8px;
 width:151px;
 height:32px;
 border-radius:5px;
 background:linear-gradient(135deg,var(--c),#454238);
 border:1px solid #bca577;
}

.ribbon{
 position:absolute;
 left:54px;
 top:-12px;
 height:127px;
 width:27px;
 background:linear-gradient(90deg,#91652d,#ffe6a8,#aa7938);
}

.bow{
 position:absolute;
 top:-38px;
 left:37px;
 font-size:38px;
}

.number{
 font:28px Georgia;
 position:absolute;
 top:50px;
 left:10px;
 color:#f8e2ae;
}

h2{
 font:24px Georgia;
 margin:10px 0;
}

.small{
 color:#c4b99f;
 font-size:13px;
}

button{
 border:0;
 border-radius:25px;
 background:linear-gradient(120deg,#ffe6ad,#b48b4e);
 color:#29271d;
 font-weight:bold;
 padding:13px 20px;
 cursor:pointer;
}

.card button{
 width:100%;
 margin-top:15px;
}

dialog{
 width:min(1100px,95vw);
 max-height:90vh;
 overflow:auto;
 background:#252e24;
 color:#f8e5bd;
 border:1px solid #b69a65;
 border-radius:24px;
 padding:25px;
}

dialog::backdrop{
 background:#000c;
}

.modalhead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.products{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
 margin-top:25px;
}

.product{
 border:1px solid #746a50;
 background:#374034;
 border-radius:14px;
 overflow:hidden;
 text-align:center;
}

.photo{
 height:140px;
 position:relative;
 background:#e6ddcb;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:55px;
}

.photo img{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
}

.name{
 padding:12px 5px 5px;
 font-size:13px;
}

.value{
 color:#f5d28b;
 padding:10px;
 font-weight:bold;
}

footer{
 text-align:center;
 padding:40px 20px;
 color:#bfb49d;
 font-size:12px;
}

@media(max-width:900px){
 .grid{grid-template-columns:repeat(3,1fr)}
 .products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:600px){
 .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
 .card{padding:12px}
 .stage{height:160px}
 .gift{scale:.8}
 .products{grid-template-columns:repeat(2,1fr)}
 h1{font-size:35px}
 h2{font-size:19px}
 .photo{height:120px}
 .logo{font-size:32px}
}

</style>
</head>

<body>

<header>

<div class="logo">6866</div>

<select id="language">
<option value="en">English</option>
<option value="ar">العربية</option>
<option value="ku">Kurmancî</option>
<option value="no">Norsk</option>
</select>

</header>

<section class="hero">
<p>HAZEL EDITION</p>
<h1 id="heading">Accessories</h1>
<p id="description">20 SIGNATURE COLLECTIONS</p>
</section>

<main class="grid" id="boxes"></main>

<dialog id="modal">

<div class="modalhead">
<h2 id="boxTitle"></h2>
<button id="close">Close</button>
</div>

<p id="info">20 products · Free preview</p>

<div class="products" id="products"></div>

</dialog>

<footer>
6866 — HAZEL EDITION<br><br>
Free catalog preview · Illustrative values<br>
No payments, wagering or real prizes.
</footer>

<script>

const boxes=[

["Hazel Gold","#8b945e"],
["Rose Diamond","#bd8597"],
["Midnight","#41434c"],
["Emerald","#367b60"],
["Royal Blue","#385d91"],
["Champagne","#c4a576"],
["Ruby","#973f4d"],
["Silver Moon","#a0a7ae"],
["Black Pearl","#303039"],
["Golden Sand","#b39559"],
["Olive Queen","#67794a"],
["Pink Crystal","#c892ad"],
["Ocean","#337c91"],
["Purple Velvet","#79528c"],
["White Pearl","#d2c8b5"],
["Copper","#b36f48"],
["Forest","#395d43"],
["Cherry","#963d57"],
["Royal Gold","#ba9140"],
["Hazel Signature","#92825d"]

];

const products=[

["Gold Watch",50,"⌚","1524805444758-089113d48a6d"],
["Crystal Ring",50,"💍","1605100804763-247f67b3557e"],
["Bracelet",4,"📿","1535632066927-ab7c9ab60908"],
["Sunglasses",3,"🕶️","1511499767150-a48a237f0083"],
["Classic Watch",4,"⌚","1523275335684-37898b6baf30"],
["Earphones",3,"🎧","1505740420928-5e560c06d30e"],
["Keychain",1,"🔑",""],
["Phone Case",3,"📱",""],
["Necklace",4,"📿",""],
["Pocket Mirror",2,"🪞",""],
["Earrings",3,"💎",""],
["Hair Clip",1,"🎀",""],
["Wallet",4,"👛",""],
["USB Cable",2,"🔌",""],
["Phone Stand",2,"📱",""],
["Fashion Ring",3,"💍",""],
["Mini Speaker",4,"🔊",""],
["LED Light",2,"🔦",""],
["USB Stick",3,"💾",""],
["Silk Scarf",4,"🧣",""]

];

const translations={

en:[
"Accessories",
"20 SIGNATURE COLLECTIONS",
"Preview contents",
"20 products · Free preview",
"Close"
],

ar:[
"الإكسسوارات",
"٢٠ مجموعة مميزة",
"معاينة المحتويات",
"٢٠ منتج · معاينة مجانية",
"إغلاق"
],

ku:[
"Aksesûar",
"20 koleksiyon",
"Berheman bibîne",
"20 berhem · Pêşdîtina belaş",
"Bigire"
],

no:[
"Tilbehør",
"20 SIGNATURKOLLEKSJONER",
"Vis innhold",
"20 produkter · Gratis visning",
"Lukk"
]

};

const $=id=>document.getElementById(id);

function render(){

const t=translations[$("language").value];

$("heading").textContent=t[0];
$("description").textContent=t[1];
$("info").textContent=t[3];
$("close").textContent=t[4];

$("boxes").replaceChildren();

boxes.forEach((box,i)=>{

const card=document.createElement("article");

card.className="card";

card.innerHTML=`
<div class="stage">
 <div class="gift" style="--c:${box[1]}">
  <div class="lid"></div>
  <div class="ribbon"></div>
  <div class="bow">🎀</div>
  <div class="number">${String(i+1).padStart(2,"0")}</div>
 </div>
</div>
<h2>${box[0]}</h2>
<div class="small">6866 COLLECTION</div>
<button>${t[2]}</button>
`;

card.querySelector("button").onclick=()=>{
 showCollection(i);
};

$("boxes").append(card);

});

}

function showCollection(index){

$("boxTitle").textContent=boxes[index][0];

$("products").replaceChildren();

products.forEach(p=>{

const item=document.createElement("article");

item.className="product";

const photo=document.createElement("div");

photo.className="photo";

photo.textContent=p[2];

if(p[3]){

const img=document.createElement("img");

img.src="https://images.unsplash.com/photo-"+p[3]+"?auto=format&fit=crop&w=400&q=80";

img.alt=p[0];

img.onerror=()=>img.remove();

photo.append(img);

}

const name=document.createElement("div");

name.className="name";

name.textContent=p[0];

const value=document.createElement("div");

value.className="value";

value.textContent="$"+p[1].toFixed(2);

item.append(photo,name,value);

$("products").append(item);

});

$("modal").showModal();

$("modal").scrollTop=0;

}

$("close").onclick=()=>$("modal").close();

$("language").onchange=render;

render();

</script>

</body>
</html>
