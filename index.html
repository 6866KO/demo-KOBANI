<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6866 | Hazel Edition</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:radial-gradient(ellipse at top,#93805c,#454633,#191d17);
color:#f8e8ca;
font-family:Arial,sans-serif;
text-align:center;
min-height:100vh;
}

header{
padding:35px;
border-bottom:1px solid #bba16b;
}

.logo{
font:65px Georgia;
letter-spacing:14px;
}

.subtitle{
letter-spacing:6px;
font-size:12px;
margin:12px;
}

h1{
font:42px Georgia;
margin-top:35px;
}

select,button{
border:1px solid #d6b77d;
border-radius:25px;
padding:13px 22px;
background:linear-gradient(120deg,#ffe6b4,#bd965c);
color:#30291d;
cursor:pointer;
font-weight:bold;
}

select{margin:15px}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
max-width:1150px;
margin:30px auto;
padding:20px;
}

.card{
border:1px solid #bba382;
border-radius:24px;
padding:25px 12px;
background:linear-gradient(145deg,#ffffff12,#00000030);
overflow:hidden;
}

.gift{
position:relative;
width:140px;
height:110px;
margin:40px auto;
border-radius:8px;
background:linear-gradient(125deg,var(--c),#24251e);
box-shadow:15px 20px 28px #0007;
}

.gift:before{
content:"";
position:absolute;
top:-15px;
left:-7px;
width:154px;
height:30px;
background:linear-gradient(120deg,var(--c),#454338);
border:1px solid #d8bf8c;
border-radius:5px;
}

.gift:after{
content:"";
position:absolute;
left:58px;
top:-15px;
width:24px;
height:125px;
background:linear-gradient(90deg,#9b7139,#ffe2a0,#ae8143);
}

h2{font:25px Georgia}

dialog{
background:#30382b;
color:#f8e8ca;
border:1px solid #c6a56e;
border-radius:24px;
width:min(850px,94vw);
padding:24px;
}

dialog::backdrop{
background:#000b;
}

.rail{
display:flex;
gap:15px;
overflow:auto;
padding:16px;
scroll-snap-type:x mandatory;
}

.item{
flex:0 0 210px;
scroll-snap-align:start;
background:#f5eadb;
color:#312b20;
border-radius:16px;
overflow:hidden;
padding-bottom:15px;
}

.item img{
width:100%;
height:180px;
object-fit:cover;
}

.item b{
display:block;
padding:10px;
}

footer{
padding:35px;
color:#d4c3a3;
font-size:13px;
}

@media(max-width:750px){
.grid{grid-template-columns:repeat(2,1fr)}
h1{font-size:32px}
.gift{transform:scale(.8);margin:25px auto}
}

@media(max-width:350px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="logo">6866</div>
<div class="subtitle">HAZEL EDITION</div>

<select id="lang">
<option value="en">English</option>
<option value="ar">العربية</option>
<option value="ku">Kurmancî</option>
<option value="no">Norsk</option>
</select>
</header>

<h1 id="heading">The Hazel Collection</h1>
<p id="sub">Explore four signature gift collections.</p>

<main class="grid" id="grid"></main>

<dialog id="modal">
<h2 id="title"></h2>
<div class="rail" id="rail"></div>
<button id="next">Next products</button>
<button id="close">Close</button>
</dialog>

<footer id="foot">
Free design preview · No purchases, wagering or prizes
</footer>

<script>

const groups=[
[
"Watch Box","#7c8b57",
[
["Classic Watch","photo-1524805444758-089113d48a6d"],
["Modern Watch","photo-1523275335684-37898b6baf30"],
["Sport Watch","photo-1547996160-81dfa63595aa"]
]
],
[
"Jewelry Box","#a77b86",
[
["Diamond Ring","photo-1605100804763-247f67b3557e"],
["Jewelry","photo-1535632066927-ab7c9ab60908"]
]
],
[
"Phone Box","#77736b",
[
["Smartphone","photo-1511707171634-5f897ff02aa9"],
["Mobile Phone","photo-1510557880182-3d4d3cba35a5"]
]
],
[
"TV Box","#427d70",
[
["Television","photo-1593359677879-a4bb92f829d1"],
["Home Display","photo-1461151304267-38535e780c79"]
]
]
];

const translations={
en:[
"The Hazel Collection",
"Explore four signature gift collections.",
"Preview collection",
"Close",
"Next products",
"Free design preview · No purchases, wagering or prizes",
["Watch Box","Jewelry Box","Phone Box","TV Box"]
],

ar:[
"مجموعة هازل",
"استكشف أربع مجموعات هدايا",
"معاينة المجموعة",
"إغلاق",
"المنتجات التالية",
"معاينة مجانية بدون دفع أو مراهنات أو جوائز",
["صندوق الساعات","صندوق المجوهرات","صندوق الهواتف","صندوق الشاشات"]
],

ku:[
"Koleksiyona Hazel",
"Çar koleksiyonên diyariyan bibîne",
"Koleksiyonê bibîne",
"Bigire",
"Berhemên din",
"Tenê pêşdîtina belaş",
["Saet","Zêr","Telefon","Televîzyon"]
],

no:[
"Hazel-kolleksjonen",
"Utforsk fire gavekolleksjoner",
"Vis kolleksjon",
"Lukk",
"Neste produkter",
"Gratis forhåndsvisning · Ingen kjøp, spill eller premier",
["Klokkeboks","Smykkeboks","Mobilboks","TV-boks"]
]
};

const $=id=>document.getElementById(id);

function render(){

let t=translations[$("lang").value];

$("heading").textContent=t[0];
$("sub").textContent=t[1];
$("close").textContent=t[3];
$("next").textContent=t[4];
$("foot").textContent=t[5];

$("grid").replaceChildren();

groups.forEach((g,i)=>{

let card=document.createElement("article");
card.className="card";

card.innerHTML=
'<div class="gift" style="--c:'+g[1]+'"></div>'+
'<h2>'+t[6][i]+'</h2>'+
'<button>'+t[2]+'</button>';

card.querySelector("button").onclick=()=>openBox(i);

$("grid").append(card);

});

}

function openBox(i){

$("title").textContent=
translations[$("lang").value][6][i];

$("rail").replaceChildren();

groups[i][2].forEach(([name,photo])=>{

let item=document.createElement("div");
item.className="item";

let img=document.createElement("img");

img.src="https://images.unsplash.com/"+photo+
"?auto=format&fit=crop&w=450&q=80";

img.alt=name;

img.onerror=()=>{
img.style.display="none";
};

let label=document.createElement("b");
label.textContent=name;

item.append(img,label);

$("rail").append(item);

});

$("modal").showModal();
$("rail").scrollLeft=0;

}

$("close").onclick=()=>$("modal").close();

$("next").onclick=()=>{

let r=$("rail");

r.scrollTo({
left:r.scrollLeft+r.clientWidth>=r.scrollWidth-5
?0:r.scrollLeft+225,
behavior:"smooth"
});

};

$("lang").onchange=render;

render();

</script>

</body>
</html>
