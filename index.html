<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123e35">
<title>KOBANI | Global Shop</title>
<meta name="description" content="KOBANI Global Shop - Fashion, watches, electronics, tools and more.">
<style>
:root{--green:#123e35;--green2:#1d6656;--gold:#e6c77d;--bg:#f6f7f5;--text:#24332f;--muted:#66736d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:var(--green);color:white;box-shadow:0 3px 15px #0002}
.top{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px}
.logo{font-family:Georgia,serif;font-size:29px;font-weight:bold;color:var(--gold);letter-spacing:3px}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--gold);color:#20372e;font-weight:bold}
.btn:hover{filter:brightness(.94)}
.btn.dark{background:var(--green);color:white}
.btn.light{background:#eef2ee;color:var(--green)}
.hero{background:linear-gradient(125deg,#123e35,#278976);color:white;text-align:center;padding:75px 18px}
.hero small{letter-spacing:3px;color:#f1dfae}
.hero h1{font-family:Georgia,serif;font-size:clamp(32px,6vw,59px);color:var(--gold);margin:20px 0}
.hero p{line-height:1.7}
.container{max-width:1250px;margin:auto;padding:30px 18px}
.section-title{font-family:Georgia,serif;font-size:30px;margin:8px 0 20px}
.search{width:100%;padding:15px;border:1px solid #d7ddd8;border-radius:12px;background:white;outline:none}
.categories{display:flex;gap:8px;overflow:auto;padding:16px 0}
.category{white-space:nowrap;border:1px solid #dce4de;background:white;padding:10px 15px;border-radius:30px;color:var(--text)}
.category.active{background:var(--green);color:white}
.count{color:var(--muted);font-size:14px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{background:white;border:1px solid #e5eae6;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #00000009}
.card img{width:100%;height:230px;object-fit:cover;background:#eee}
.card-content{padding:15px}
.card h3{font-size:16px;margin:0 0 9px;min-height:38px}
.price{font-size:22px;font-weight:bold;color:var(--green)}
.note{color:var(--muted);font-size:12px;line-height:1.6}
.card .btn{width:100%;margin-top:12px}
footer{background:var(--green);color:white;text-align:center;padding:35px 18px;margin-top:40px}
footer h2{color:var(--gold);letter-spacing:3px}
.overlay{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}
.overlay.show{display:flex}
.modal{background:white;width:min(100%,680px);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.close{background:#edf1ee;border:0;border-radius:9px;padding:9px 13px;font-size:20px}
.product-detail{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:15px}
.product-detail img{width:100%;height:300px;object-fit:cover;border-radius:12px}
.field{display:block;margin:13px 0;font-size:14px;font-weight:bold}
.field input,.field select,.field textarea{display:block;width:100%;padding:12px;border:1px solid #cfd9d2;border-radius:9px;margin-top:7px;background:white}
.field textarea{min-height:80px;resize:vertical}
.cart-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:14px 0}
.cart-line small{display:block;color:var(--muted);margin-top:5px}
.cart-total{font-size:23px;font-weight:bold;text-align:right;margin:20px 0}
.warning{background:#fff7e5;border:1px solid #efdbac;padding:13px;border-radius:10px;font-size:13px;line-height:1.7}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.qty{display:flex;align-items:center;gap:10px;margin:12px 0}
.qty button{padding:7px 13px;border:1px solid #ddd;background:#fff;border-radius:8px}
.hidden{display:none!important}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card img{height:165px}
.card-content{padding:11px}
.card h3{font-size:14px}
.price{font-size:18px}
.logo{font-size:21px}
.top{padding:12px}
.actions .btn{padding:9px}
.product-detail{grid-template-columns:1fr}
.product-detail img{height:230px}
.hero{padding:55px 15px}
}
</style>
</head>
<body>

<header>
<div class="top">
<div class="logo">♛ KOBANI</div>
<div class="actions">
<button class="btn" id="langBtn" onclick="changeLanguage()">العربية</button>
<button class="btn" onclick="openCart()">🛒 <span id="cartLabel">Cart</span> (<span id="cartCount">0</span>)</button>
</div>
</div>
</header>

<section class="hero">
<small>✦ PREMIUM GLOBAL MARKETPLACE ✦</small>
<h1>KOBANI GLOBAL SHOP</h1>
<p id="heroText">Fashion • Watches • Electronics • Tools • Home • More</p>
<button class="btn" onclick="document.getElementById('products').scrollIntoView()">SHOP NOW</button>
</section>

<main class="container" id="products">
<h2 class="section-title" id="exploreTitle">Explore Products</h2>
<input class="search" id="search" placeholder="Search products..." oninput="renderProducts()">
<div class="categories" id="categories"></div>
<div class="count" id="resultCount"></div>
<div class="grid" id="productGrid"></div>
</main>

<footer>
<h2>♛ KOBANI</h2>
<p>GLOBAL SHOP</p>
<p>© 2026 KOBANI</p>
<p id="footerNotice">Demo storefront. Real payments, supplier fulfillment and shipping are not connected.</p>
</footer>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
<div class="modal-head">
<h2 id="modalTitle"></h2>
<button class="close" onclick="closeModal()">×</button>
</div>
<div id="modalBody"></div>
</div>
</div>

<script>
"use strict";

/*
 KOBANI STORE
 Front-end demonstration only.
 No payment gateway or CJdropshipping integration.
 Product data and prices below are illustrative.
*/

const products=[
{id:1,name:"Men's Slim Fit Hoodie",category:"Fashion",price:24.99,colors:["Black","Grey","Green","Khaki","White"],sizes:["S","M","L","XL","XXL","XXXL"],image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=700"},
{id:2,name:"Classic Cotton T-Shirt",category:"Fashion",price:15.99,colors:["Black","White","Blue"],sizes:["S","M","L","XL"],image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=700"},
{id:3,name:"Denim Jeans",category:"Fashion",price:34.99,colors:["Blue","Black"],sizes:["S","M","L","XL"],image:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=700"},
{id:4,name:"Winter Jacket",category:"Fashion",price:59.99,colors:["Black","Grey"],sizes:["M","L","XL","XXL"],image:"https://images.unsplash.com/photo-1544923246-77307dd654cb?w=700"},
{id:5,name:"Women's Casual Dress",category:"Fashion",price:29.99,colors:["Black","White","Pink"],sizes:["S","M","L","XL"],image:"https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=700"},
{id:6,name:"Running Sneakers",category:"Shoes",price:39.99,colors:["Black","White"],sizes:["39","40","41","42","43","44"],image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700"},
{id:7,name:"Casual Shoes",category:"Shoes",price:32.99,colors:["Black","Brown"],sizes:["39","40","41","42","43"],image:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=700"},
{id:8,name:"Leather Boots",category:"Shoes",price:49.99,colors:["Brown","Black"],sizes:["40","41","42","43","44"],image:"https://images.unsplash.com/photo-1520639888713-7851133b1ed0?w=700"},
{id:9,name:"Classic Wrist Watch",category:"Watches",price:44.99,colors:["Black","Silver","Gold"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=700"},
{id:10,name:"Luxury Style Watch",category:"Watches",price:79.99,colors:["Gold","Silver"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=700"},
{id:11,name:"Wireless Headphones",category:"Electronics",price:35.99,colors:["Black","White"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=700"},
{id:12,name:"Bluetooth Speaker",category:"Electronics",price:29.99,colors:["Black","Blue"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=700"},
{id:13,name:"Mechanical Keyboard",category:"Electronics",price:54.99,colors:["Black","White"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=700"},
{id:14,name:"Computer Mouse",category:"Electronics",price:19.99,colors:["Black","White"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1527814050087-3793815479db?w=700"},
{id:15,name:"Phone Case",category:"Phones",price:12.99,colors:["Black","Clear"],sizes:["Universal"],image:"https://images.unsplash.com/photo-1603313011101-320f26a4f6f6?w=700"},
{id:16,name:"Power Bank",category:"Phones",price:27.99,colors:["Black","White"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1609592806596-b43bada2f6a4?w=700"},
{id:17,name:"Safety Work Gloves",category:"Workwear",price:13.99,colors:["Black","Grey"],sizes:["M","L","XL"],image:"https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=700"},
{id:18,name:"Work Safety Helmet",category:"Workwear",price:24.99,colors:["Yellow","White"],sizes:["Adjustable"],image:"https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=700"},
{id:19,name:"Cordless Power Drill",category:"Tools",price:69.99,colors:["Black"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1504148455328-c376907d081c?w=700"},
{id:20,name:"Hand Tool Set",category:"Tools",price:42.99,colors:["Mixed"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1581147036324-c1c89c2c8b5c?w=700"},
{id:21,name:"Camping Tent",category:"Camping",price:89.99,colors:["Green","Blue"],sizes:["2 Person","4 Person"],image:"https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?w=700"},
{id:22,name:"Camping Backpack",category:"Camping",price:49.99,colors:["Black","Green"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1551632811-561732d1e306?w=700"},
{id:23,name:"Desk Lamp",category:"Home",price:25.99,colors:["Black","White"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=700"},
{id:24,name:"Decorative Cushion",category:"Home",price:17.99,colors:["Beige","Grey"],sizes:["One Size"],image:"https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=700"}
];

const categoryNames=["All Products","Fashion","Shoes","Watches","Electronics","Phones","Workwear","Tools","Camping","Home"];
const icons={"All Products":"🌍","Fashion":"👕","Shoes":"👟","Watches":"⌚","Electronics":"🎧","Phones":"📱","Workwear":"🦺","Tools":"🔧","Camping":"🏕️","Home":"🏠"};
const arabicCategories={"All Products":"كل المنتجات","Fashion":"ملابس","Shoes":"أحذية","Watches":"ساعات","Electronics":"إلكترونيات","Phones":"هواتف","Workwear":"ملابس عمل","Tools":"أدوات","Camping":"تخييم","Home":"منزل"};

let language="en";
let activeCategory="All Products";
let selectedProduct=null;
let selectedQuantity=1;
let cart=[];

try{
 const saved=JSON.parse(localStorage.getItem("kobani_cart_v1")||"[]");
 if(Array.isArray(saved))cart=saved.filter(x=>products.some(p=>p.id===x.id)&&Number.isInteger(x.qty)&&x.qty>0);
}catch(e){cart=[]}

const $=id=>document.getElementById(id);
const tr=(en,ar)=>language==="ar"?ar:en;
const money=n=>"$"+Number(n).toFixed(2);

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function saveCart(){
 try{localStorage.setItem("kobani_cart_v1",JSON.stringify(cart))}catch(e){}
 updateCartCount();
}

function updateCartCount(){
 $("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);
}

function renderCategories(){
 $("categories").innerHTML=categoryNames.map(c=>
 `<button class="category ${activeCategory===c?"active":""}" onclick="setCategory('${c}')">${icons[c]} ${language==="ar"?arabicCategories[c]:c}</button>`
 ).join("");
}

function setCategory(c){
 activeCategory=c;
 renderCategories();
 renderProducts();
}

function renderProducts(){
 const q=$("search").value.trim().toLowerCase();
 const list=products.filter(p=>(activeCategory==="All Products"||p.category===activeCategory)&&p.name.toLowerCase().includes(q));
 $("resultCount").textContent=list.length+" "+tr("demo products","منتج تجريبي");
 $("productGrid").innerHTML=list.length?list.map(p=>`
 <article class="card">
 <img src="${p.image}" alt="${escapeHTML(p.name)}" loading="lazy" onerror="this.style.visibility='hidden'">
 <div class="card-content">
 <h3>${escapeHTML(p.name)}</h3>
 <div class="price">${money(p.price)}</div>
 <div class="note">${tr("Illustrative product and price","منتج وسعر توضيحيان")}</div>
 <button class="btn dark" onclick="openProduct(${p.id})">${tr("View Product","عرض المنتج")}</button>
 </div>
 </article>`).join(""):`<div class="empty">${tr("No products found","ما لقينا منتجات")}</div>`;
}

function openModal(title,body){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=body;
 $("overlay").classList.add("show");
 document.body.style.overflow="hidden";
}

function closeModal(){
 $("overlay").classList.remove("show");
 document.body.style.overflow="";
}

function openProduct(id){
 selectedProduct=products.find(p=>p.id===id);
 selectedQuantity=1;
 const p=selectedProduct;
 openModal(p.name,`
 <div class="product-detail">
 <img src="${p.image}" alt="${escapeHTML(p.name)}">
 <div>
 <div class="price">${money(p.price)}</div>
 <p class="note">${tr("Demo product. Availability, supplier price and shipping must be verified.","منتج تجريبي. لازم نتأكد من التوفر والسعر والشحن عند المورّد.")}</p>
 <label class="field">${tr("Color","اللون")}
 <select id="productColor">${p.colors.map(x=>`<option value="${escapeHTML(x)}">${escapeHTML(x)}</option>`).join("")}</select>
 </label>
 <label class="field">${tr("Size","المقاس")}
 <select id="productSize">${p.sizes.map(x=>`<option value="${escapeHTML(x)}">${escapeHTML(x)}</option>`).join("")}</select>
 </label>
 <div class="qty">
 <button onclick="changeQty(-1)">−</button>
 <strong id="productQty">1</strong>
 <button onclick="changeQty(1)">+</button>
 </div>
 <button class="btn dark" style="width:100%" onclick="addToCart()">${tr("Add to Cart","أضف للسلة")}</button>
 </div>
 </div>`);
}

function changeQty(n){
 selectedQuantity=Math.max(1,Math.min(99,selectedQuantity+n));
 $("productQty").textContent=selectedQuantity;
}

function addToCart(){
 if(!selectedProduct)return;
 const color=$("productColor").value;
 const size=$("productSize").value;
 const found=cart.find(x=>x.id===selectedProduct.id&&x.color===color&&x.size===size);
 if(found)found.qty=Math.min(99,found.qty+selectedQuantity);
 else cart.push({id:selectedProduct.id,color,size,qty:selectedQuantity});
 saveCart();
 openCart();
}

function cartTotal(){
 return cart.reduce((sum,x)=>{
 const p=products.find(p=>p.id===x.id);
 return sum+(p?p.price*x.qty:0);
 },0);
}

function removeItem(i){
 cart.splice(i,1);
 saveCart();
 openCart();
}

function openCart(){
 let body="";
 if(!cart.length){
 body=`<div class="empty">${tr("Your cart is empty","سلتك فاضية")}</div>`;
 }else{
 body=cart.map((x,i)=>{
 const p=products.find(p=>p.id===x.id);
 return `<div class="cart-line">
 <div><strong>${escapeHTML(p.name)}</strong><small>${escapeHTML(x.color)} / ${escapeHTML(x.size)} × ${x.qty}</small><small>${money(p.price)} ${tr("each","للقطعة")}</small></div>
 <div style="text-align:right"><strong>${money(p.price*x.qty)}</strong><br><button class="btn light" style="margin-top:8px" onclick="removeItem(${i})">${tr("Remove","حذف")}</button></div>
 </div>`;
 }).join("");
 body+=`<div class="cart-total">${tr("Subtotal","المجموع")}: ${money(cartTotal())}</div>
 <div class="warning">${tr("Shipping, taxes and payment are not included. This is a demo cart.","الشحن والضرائب والدفع غير محسوبين. هاي سلة تجريبية.")}</div>
 <button class="btn dark" style="width:100%;margin-top:15px" onclick="openCheckout()">${tr("Continue to Order Details","متابعة لبيانات الطلب")}</button>`;
 }
 openModal(tr("Shopping Cart","سلة المشتريات"),body);
}

function openCheckout(){
 if(!cart.length){openCart();return}
 openModal(tr("Order Details — Demo","بيانات الطلب — تجريبي"),`
 <div class="warning">${tr("This form does NOT submit a real order, charge money, or send anything to CJdropshipping. Do not enter real personal information while testing.","هذا النموذج لا يرسل طلب حقيقي ولا يسحب أموال ولا يرسل شي إلى CJdropshipping. لا تدخل معلومات شخصية حقيقية أثناء التجربة.")}</div>
 <form id="checkoutForm" onsubmit="previewOrder(event)">
 <label class="field">${tr("Customer Name","اسم الزبون")}<input name="customer" required maxlength="80" placeholder="${tr("Test Customer","زبون تجريبي")}"></label>
 <label class="field">${tr("Email","البريد الإلكتروني")}<input type="email" name="email" required placeholder="test@example.com"></label>
 <label class="field">${tr("Country","البلد")}
 <select name="country" required>
 <option value="">${tr("Select Country","اختر البلد")}</option>
 <option>Syria</option><option>Norway</option><option>Turkey</option>
 <option>Germany</option><option>Sweden</option><option>United States</option>
 <option>Other</option>
 </select></label>
 <label class="field">${tr("City","المدينة")}<input name="city" required maxlength="80"></label>
 <label class="field">${tr("Shipping Address","عنوان الشحن")}<textarea name="address" required maxlength="300"></textarea></label>
 <label class="field">${tr("Phone","الهاتف")}<input type="tel" name="phone" required maxlength="30"></label>
 <label class="field">${tr("Notes","ملاحظات")}<textarea name="notes" maxlength="300"></textarea></label>
 <div class="cart-total">${tr("Products Subtotal","مجموع المنتجات")}: ${money(cartTotal())}</div>
 <div class="warning">${tr("Delivery to the selected country is not confirmed. Final shipping cost is unknown.","الشحن إلى البلد المختار غير مؤكّد. تكلفة الشحن النهائية غير معروفة.")}</div>
 <button class="btn dark" style="width:100%;margin-top:15px" type="submit">${tr("Preview Demo Order","معاينة الطلب التجريبي")}</button>
 </form>`);
}

function previewOrder(event){
 event.preventDefault();
 const data=new FormData(event.target);
 const items=cart.map(x=>{
 const p=products.find(p=>p.id===x.id);
 return `${p.name} (${x.color}, ${x.size}) × ${x.qty}`;
 });
 const preview=[
 "KOBANI — DEMO ORDER (NOT SUBMITTED)",
 "Customer: "+data.get("customer"),
 "Country: "+data.get("country"),
 "City: "+data.get("city"),
 "Items:",
 ...items,
 "Products subtotal: "+money(cartTotal()),
 "Shipping: Not calculated",
 "Payment: Not connected",
 "Supplier fulfillment: Not connected"
 ].join("\n");
 openModal(tr("Demo Order Preview","معاينة الطلب التجريبي"),`
 <div class="warning">${tr("This is only a preview. No real order was placed and no data was sent to a supplier.","هذه معاينة فقط. لم يتم إنشاء طلب حقيقي ولم تُرسل البيانات لأي مورّد.")}</div>
 <pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6f4;padding:15px;border-radius:10px">${escapeHTML(preview)}</pre>
 <button class="btn dark" style="width:100%" onclick="copyPreview()">${tr("Copy Demo Summary","نسخ ملخص التجربة")}</button>
 <button class="btn light" style="width:100%;margin-top:8px" onclick="openCart()">${tr("Back to Cart","العودة للسلة")}</button>`);
 window.lastDemoPreview=preview;
}

function copyPreview(){
 const value=window.lastDemoPreview||"";
 if(navigator.clipboard&&window.isSecureContext){
 navigator.clipboard.writeText(value).then(()=>alert(tr("Copied","تم النسخ"))).catch(()=>alert(tr("Copy not available","النسخ غير متاح")));
 }else{
 alert(tr("Copy the summary manually","انسخ الملخص يدوياً"));
 }
}

function changeLanguage(){
 language=language==="en"?"ar":"en";
 document.documentElement.lang=language;
 document.documentElement.dir=language==="ar"?"rtl":"ltr";
 $("langBtn").textContent=language==="ar"?"English":"العربية";
 $("cartLabel").textContent=tr("Cart","السلة");
 $("heroText").textContent=tr("Fashion • Watches • Electronics • Tools • Home • More","ملابس • ساعات • إلكترونيات • أدوات • منزل • المزيد");
 $("exploreTitle").textContent=tr("Explore Products","تصفح المنتجات");
 $("search").placeholder=tr("Search products...","ابحث عن منتج...");
 $("footerNotice").textContent=tr("Demo storefront. Real payments, supplier fulfillment and shipping are not connected.","متجر تجريبي. الدفع الحقيقي والشحن والربط بالمورّد غير مفعّلين.");
 closeModal();
 renderCategories();
 renderProducts();
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeModal();
});

renderCategories();
renderProducts();
updateCartCount();
</script>
</body>
</html>

<!-- KOBANI CUSTOMER FEATURES -->
<style>
.kb-tools{
 position:fixed;bottom:18px;left:18px;z-index:9999;
 display:flex;gap:8px;flex-wrap:wrap
}
.kb-tools button{
 background:#123e35;color:#f1d58a;
 border:1px solid #d8b76b;border-radius:12px;
 padding:12px 15px;cursor:pointer;font-weight:bold
}
.kb-panel{
 display:none;position:fixed;inset:0;z-index:10000;
 background:#0009;align-items:center;justify-content:center;
 padding:15px;font-family:Arial,sans-serif
}
.kb-panel.open{display:flex}
.kb-box{
 background:#fff;color:#173e34;border-radius:18px;
 padding:22px;width:min(100%,480px);
 max-height:90vh;overflow:auto;direction:rtl
}
.kb-box input,.kb-box textarea,.kb-box select{
 width:100%;padding:12px;margin:7px 0;
 border:1px solid #ddd;border-radius:9px
}
.kb-box button{
 padding:11px;border:0;border-radius:9px;
 background:#123e35;color:white;cursor:pointer;margin:5px
}
.kb-star{font-size:28px;color:#c49b37;cursor:pointer}
.kb-review{border-bottom:1px solid #ddd;padding:12px 0}
</style>

<div class="kb-tools">
<button onclick="kbOpen('account')">👤 حسابي</button>
<button onclick="kbOpen('wallet')">💰 محفظتي</button>
<button onclick="kbOpen('reviews')">⭐ التقييمات</button>
<button onclick="kbOpen('favorites')">❤️ المفضلة</button>
</div>

<div class="kb-panel" id="kbPanel"
 onclick="if(event.target===this)kbClose()">
<div class="kb-box">
<button onclick="kbClose()">✕ إغلاق</button>
<div id="kbContent"></div>
</div>
</div>

<script>
(function(){
"use strict";

const KEY="kobani_demo_features_v1";

function read(){
 try{
  return JSON.parse(localStorage.getItem(KEY))||{};
 }catch(e){return {}}
}
function save(d){
 try{localStorage.setItem(KEY,JSON.stringify(d))}
 catch(e){alert("تعذّر الحفظ على الجهاز")}
}
function safe(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}
function data(){
 const d=read();
 if(!Array.isArray(d.reviews))d.reviews=[];
 if(!Array.isArray(d.favorites))d.favorites=[];
 return d;
}

window.kbClose=function(){
 document.getElementById("kbPanel").classList.remove("open");
};

window.kbOpen=function(page){
 const d=data();
 const box=document.getElementById("kbContent");
 document.getElementById("kbPanel").classList.add("open");

 if(page==="account"){
  box.innerHTML=`
  <h2>👤 الملف الشخصي</h2>
  <p>هذا ملف تجريبي محفوظ على جهازك فقط.</p>
  <label>الاسم</label>
  <input id="kbName" maxlength="70"
   value="${safe(d.name||"")}" placeholder="اسمك">
  <label>البلد</label>
  <select id="kbCountry">
   <option value="">اختر البلد</option>
   ${["سوريا","العراق","لبنان","الأردن","السعودية",
   "الإمارات","الكويت","قطر","البحرين","عُمان",
   "تركيا","مصر","النرويج","ألمانيا","أخرى"]
   .map(x=>`<option ${d.country===x?"selected":""}>${x}</option>`).join("")}
  </select>
  <button onclick="kbSaveProfile()">حفظ الملف</button>
  <p style="font-size:12px">
  تسجيل الدخول الحقيقي وكلمات المرور غير مفعّلين بعد.
  </p>`;
 }

 if(page==="wallet"){
  box.innerHTML=`
  <h2>💰 محفظة KOBANI</h2>
  <h1>$0.00</h1>
  <p>الرصيد التجريبي</p>
  <p>الإيداع والسحب والدفع غير مفعّلين.</p>
  <p>المحفظة الحقيقية تحتاج نظام دفع وحماية حسابات.</p>`;
 }

 if(page==="favorites"){
  box.innerHTML=`
  <h2>❤️ المفضلة</h2>
  <p>أضف اسم المنتج الذي تريد حفظه:</p>
  <input id="kbFavName" maxlength="120"
   placeholder="اسم المنتج">
  <button onclick="kbAddFavorite()">إضافة</button>
  <div id="kbFavList"></div>`;
  kbRenderFavorites();
 }

 if(page==="reviews"){
  box.innerHTML=`
  <h2>⭐ تقييمات المنتجات</h2>
  <p>اكتب اسم المنتج ورأيك فيه:</p>
  <input id="kbReviewProduct" maxlength="120"
   placeholder="اسم المنتج">
  <select id="kbRating">
   <option value="5">★★★★★ — 5</option>
   <option value="4">★★★★☆ — 4</option>
   <option value="3">★★★☆☆ — 3</option>
   <option value="2">★★☆☆☆ — 2</option>
   <option value="1">★☆☆☆☆ — 1</option>
  </select>
  <textarea id="kbReviewText" maxlength="500"
   placeholder="اكتب تعليقك"></textarea>
  <button onclick="kbAddReview()">نشر على هذا الجهاز</button>
  <div id="kbReviewList"></div>
  <p style="font-size:12px">
  التعليقات حالياً لا تظهر للزبائن الآخرين.
  </p>`;
  kbRenderReviews();
 }
};

window.kbSaveProfile=function(){
 const d=data();
 d.name=document.getElementById("kbName").value.trim();
 d.country=document.getElementById("kbCountry").value;
 save(d);
 alert("تم حفظ الملف على هذا الجهاز");
};

window.kbAddFavorite=function(){
 const input=document.getElementById("kbFavName");
 const name=input.value.trim();
 if(!name)return alert("اكتب اسم المنتج");
 const d=data();
 if(!d.favorites.includes(name))d.favorites.push(name);
 save(d);
 input.value="";
 kbRenderFavorites();
};

window.kbRemoveFavorite=function(i){
 const d=data();
 d.favorites.splice(i,1);
 save(d);
 kbRenderFavorites();
};

window.kbRenderFavorites=function(){
 const d=data();
 const el=document.getElementById("kbFavList");
 if(!el)return;
 el.innerHTML=d.favorites.length
 ?d.favorites.map((name,i)=>`
 <div class="kb-review">
 ${safe(name)}
 <button onclick="kbRemoveFavorite(${i})">حذف</button>
 </div>`).join("")
 :"<p>ما في منتجات بالمفضلة بعد.</p>";
};

window.kbAddReview=function(){
 const product=document.getElementById("kbReviewProduct").value.trim();
 const text=document.getElementById("kbReviewText").value.trim();
 const rating=Number(document.getElementById("kbRating").value);
 if(!product||!text)return alert("اكتب المنتج والتعليق");
 const d=data();
 d.reviews.unshift({
  product,text,rating,date:new Date().toLocaleDateString("ar")
 });
 save(d);
 document.getElementById("kbReviewProduct").value="";
 document.getElementById("kbReviewText").value="";
 kbRenderReviews();
};

window.kbRenderReviews=function(){
 const el=document.getElementById("kbReviewList");
 if(!el)return;
 const d=data();
 el.innerHTML=d.reviews.length
 ?d.reviews.map(r=>`
 <div class="kb-review">
 <strong>${safe(r.product)}</strong>
 <div style="color:#bd922d">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div>
 <p>${safe(r.text)}</p>
 <small>${safe(r.date)}</small>
 </div>`).join("")
 :"<p>ما في تقييمات محفوظة بعد.</p>";
};

})();
</script>
<!-- END KOBANI CUSTOMER FEATURES -->
