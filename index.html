<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6866 | Hazel Collections</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:radial-gradient(ellipse at top,#887552,#343c2d,#141a15);
color:#f8e5bd;
font-family:Arial,sans-serif;
}
header{
padding:25px;
text-align:center;
border-bottom:1px solid #b99d68;
}
.logo{
font:65px Georgia;
letter-spacing:12px;
}
.hero{text-align:center;padding:30px}
h1{font:44px Georgia}
h2{font:24px Georgia}
.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
max-width:1400px;
margin:auto;
padding:20px;
}
.card{
background:#ffffff0c;
border:1px solid #99835d;
border-radius:22px;
overflow:hidden;
padding:12px;
text-align:center;
}
.card:hover{
border-color:#ffe1a1;
transform:translateY(-3px);
}
.cover{
height:220px;
border-radius:15px;
overflow:hidden;
background:#d5c7a7;
}
.cover img{
width:100%;
height:100%;
object-fit:cover;
}
button{
background:linear-gradient(120deg,#ffe5ac,#b78c4b);
color:#29271c;
border:0;
border-radius:25px;
padding:14px 22px;
font-weight:bold;
cursor:pointer;
}
.card button{width:100%}
dialog{
width:min(1100px,95vw);
max-height:90vh;
background:#283126;
color:#f8e5bd;
border:1px solid #c6aa72;
border-radius:24px;
padding:22px;
}
dialog::backdrop{background:#000c}
.top{
display:flex;
align-items:center;
justify-content:space-between;
}
.window{
overflow:hidden;
background:#161d16;
border:1px solid #bba16b;
border-radius:16px;
padding:15px 0;
margin:20px 0;
}
.track{
display:flex;
width:max-content;
animation:slide 35s linear infinite;
}
@keyframes slide{
to{transform:translateX(-50%)}
}
.tile{
width:160px;
flex-shrink:0;
background:#394333;
border:1px solid #8e805f;
border-radius:12px;
overflow:hidden;
text-align:center;
margin:6px;
}
.photo{
height:140px;
background:#e3dac7;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
}
.photo img{
width:100%;
height:100%;
object-fit:cover;
}
.name{padding:12px 4px}
.products{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
}
.products .tile{
width:100%;
margin:0;
}
footer{
text-align:center;
padding:35px;
color:#bdb399;
font-size:12px;
}
@media(max-width:700px){
.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.cover{height:160px}
.products{grid-template-columns:repeat(2,1fr)}
h1{font-size:32px}
h2{font-size:19px}
}
</style>
</head>
<body>

<header>
<div class="logo">6866</div>
<p>HAZEL EDITION</p>
</header>

<section class="hero">
<h1>Accessories Collections</h1>
<p>20 signature collections</p>
</section>

<main class="grid" id="boxes"></main>

<dialog id="modal">
<div class="top">
<h2 id="title"></h2>
<button id="close">Close</button>
</div>

<p>Animated collection preview</p>

<div class="window">
<div class="track" id="track"></div>
</div>

<button id="pause">Pause preview</button>

<h2>Collection contents</h2>
<div class="products" id="products"></div>
</dialog>

<footer>
6866 HAZEL EDITION
<p>Free catalog preview. No payments or prizes.</p>
</footer>

<script>

const collections = [

["Sound Wave",2,[21,24,28,30,31,34,38,46,47,48]],

["Modern Tablet",15,[21,24,28,30,31,32,38,46,47,48]],
["Music Lounge",16,[20,21,29,30,34,38,41,46,47,49]],
["Urban Fashion",17,[22,26,33,34,35,36,40,42,43,44]],
["Office Elite",18,[21,28,30,31,32,36,38,45,47,49]],
["Hazel Signature",19,[20,23,25,26,31,32,36,40,45,49]]

];

const $=id=>document.getElementById(id);

function picture(product){

const div=document.createElement("div");
div.className="photo";
div.textContent=product[1];

if(product[2]){

const img=document.createElement("img");

img.src="https://images.unsplash.com/photo-"+
product[2]+"?auto=format&fit=crop&w=500&q=80";

img.alt=product[0];

img.onload=()=>{
div.textContent="";
div.append(img);
};

}

return div;
}

function tile(product){

const el=document.createElement("article");
el.className="tile";

const label=document.createElement("div");
label.className="name";
label.textContent=product[0];

el.append(picture(product),label);

return el;

}

collections.forEach((box,i)=>{

const card=document.createElement("article");
card.className="card";

const cover=picture(catalog[box[1]]);
cover.className="photo cover";

const title=document.createElement("h2");
title.textContent=box[0];

const description=document.createElement("p");
description.textContent="11 products";

const button=document.createElement("button");
button.textContent="View collection";
button.onclick=()=>showCollection(i);

card.append(cover,title,description,button);

$("boxes").append(card);

});

function showCollection(i){

const box=collections[i];

const items=[
catalog[box[1]],
...box[2].map(n=>catalog[n])
];

$("title").textContent=box[0];

$("track").replaceChildren();
$("products").replaceChildren();

items.forEach(p=>{
$("products").append(tile(p));
});

[...items,...items].forEach(p=>{
$("track").append(tile(p));
});

$("track").style.animationPlayState="running";
$("pause").textContent="Pause preview";

$("modal").showModal();

}

$("close").onclick=()=>$("modal").close();

$("pause").onclick=()=>{

const track=$("track");

const paused=track.style.animationPlayState==="paused";

track.style.animationPlayState=paused?"running":"paused";

$("pause").textContent=paused?"Pause preview":"Resume preview";

};

</script>
</body>
</html>
